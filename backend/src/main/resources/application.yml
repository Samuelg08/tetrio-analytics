spring:
  application:
    name: tetrio-analytics-backend
  config:
    import: optional:file:.env[.properties]
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/tetrio_analytics_dev}
      database: ${MONGODB_DATABASE:tetrio_analytics_dev}
      auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:true}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  tetra-channel:
    base-url: ${TETRA_CHANNEL_BASE_URL:https://ch.tetr.io/api}
    timeout-ms: ${TETRA_CHANNEL_TIMEOUT_MS:5000}
    min-interval-ms: ${TETRA_CHANNEL_MIN_INTERVAL_MS:1100}
    acquire-timeout-ms: ${TETRA_CHANNEL_ACQUIRE_TIMEOUT_MS:3000}
    user-agent: tetrio-competitive-analytics-mvp/0.2
  cache:
    ttl-seconds: ${CACHE_TTL_SECONDS:300}
  extraction:
    enabled: ${EXTRACTION_ENABLED:false}
    phases: ${EXTRACTION_PHASES:leaderboard_league}
    batch-size: ${EXTRACTION_BATCH_SIZE:100}
    max-pages: ${EXTRACTION_MAX_PAGES:0}
    max-retries: ${EXTRACTION_MAX_RETRIES:3}
    max-consecutive-errors: ${EXTRACTION_MAX_CONSECUTIVE_ERRORS:5}
    raw-dir: ${EXTRACTION_RAW_DIR:../data/raw}
    processed-dir: ${EXTRACTION_PROCESSED_DIR:../data/processed}
    resume-run-id: ${EXTRACTION_RESUME_RUN_ID:}
    dataset-version: ${EXTRACTION_DATASET_VERSION:}
